name: Release

# Publishes the Docker image of a version on GHCR (ADR 0007) when a tag v2.*
# is pushed, then creates the GitHub Release. The tag must match the version
# of package.json, and the CI checks are replayed on the tagged commit first.
on:
  push:
    tags: ['v2.*']

permissions: {}

# Never two publications of the same tag at once
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aquatracking/app

jobs:
  version:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the tag with the version of package.json
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi

  # Same checks as on a pull request (lint, typecheck, tests on PostgreSQL 16
  # and 18, image smoke test), replayed on the tagged commit
  ci:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the image on GHCR
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v2.0.0 gives 2.0.0, 2.0, 2 and latest; a pre-release (v2.1.0-rc.1)
      # gives only 2.1.0-rc.1, never latest. Labels and annotations carry the
      # OCI source, version and revision.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=AquaTracking
            org.opencontainers.image.description=Self-hosted tracking of aquarium, terrarium and paludarium parameters
          annotations: |
            org.opencontainers.image.title=AquaTracking
            org.opencontainers.image.description=Self-hosted tracking of aquarium, terrarium and paludarium parameters

      # arm64 is emulated, but only "pnpm install --prod" runs emulated: the
      # build stages of the Dockerfile run on the runner's platform
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            $prerelease
