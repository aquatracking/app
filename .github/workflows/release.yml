name: Release

# Publishes the Docker image of a version on GHCR (ADR 0007) when a tag v2.*
# is pushed, then creates the GitHub Release:
#   version       the tag matches package.json, is on main; computes the tags,
#                 and finds the digest of X.Y.Z if it is already published
#   ci            ci.yml replayed on the tagged commit
#   publish       publish.yml: multi-arch image pushed by digest only (or the
#                 already published digest, never rebuilt), that digest
#                 started on native amd64 and arm64 runners, then the version
#                 and floating tags set on the tested digest
#   github-release  created if it does not exist yet
# A failed run must be re-run with "Re-run all jobs" (docs/architecture.md).
on:
  push:
    tags: ['v2.*']

permissions: {}

# One publication at a time, whatever the tag: floating tags (2, 2.Y,
# latest) are never written by two runs at once
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Inspects ghcr.io/aquatracking/app:X.Y.Z
      packages: read
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      version: ${{ steps.tags.outputs.version }}
      digest: ${{ steps.published.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All tags and origin/main, to compare versions and ancestry
          fetch-depth: 0
          persist-credentials: false

      - name: Tag matches package.json
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi

      - name: Tag points to a commit of main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      # Image tags: the exact version, plus floating tags that only move
      # forward. X.Y for the highest stable version of the X.Y line, X for the
      # highest of the X line, latest for the highest of all, among the
      # vX.Y.Z git tags reachable from main, sorted as semver. A pre-release
      # gets its own tag only.
      - id: tags
        name: Image tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="$version"
          if echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            stable="$(git tag --merged origin/main --list 'v*' | sed 's/^v//' | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V)"
            # Highest stable version starting with the prefix $1
            highest() { echo "$stable" | awk -v p="$1" 'p == "" || index($0, p) == 1' | tail -n 1; }
            if [ "$version" = "$(highest "${version%.*}.")" ]; then tags="$tags ${version%.*}"; fi
            if [ "$version" = "$(highest "${version%%.*}.")" ]; then tags="$tags ${version%%.*}"; fi
            if [ "$version" = "$(highest '')" ]; then tags="$tags latest"; fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME: $tags"

      - if: github.repository == 'aquatracking/app'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z never changes (ADR 0007): if a previous run of this tag already
      # set it, that digest is tagged again instead of a rebuild, which would
      # get another digest. Only "not found" means it is not published: any
      # other error stops the run rather than risk a rebuild
      - id: published
        name: Already published version
        if: github.repository == 'aquatracking/app'
        env:
          TAG: ghcr.io/aquatracking/app:${{ steps.tags.outputs.version }}
        run: |
          if ! output="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' 2>&1)"; then
            case "$output" in
              *": not found") echo "$TAG is not published yet"; exit 0 ;;
              *) echo "$output"; echo "::error::Cannot inspect $TAG"; exit 1 ;;
            esac
          fi
          digest="$(echo "$output" | jq -r .digest)"
          revision="$(docker buildx imagetools inspect "$TAG" \
            --format '{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG is already published from $revision, not $GITHUB_SHA"
            exit 1
          fi
          echo "::notice::$TAG already published ($digest): not rebuilt, its tags are set again"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Same checks as on a pull request (lint, typecheck, tests on PostgreSQL 16
  # and 18, image smoke test), replayed on the tagged commit
  ci:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Push by digest (or the already published digest), smoke test on amd64
  # and arm64, then the version and floating tags set on the tested digest
  publish:
    needs: [version, ci]
    # A fork has no access to the image
    if: github.repository == 'aquatracking/app'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tags: ${{ needs.version.outputs.tags }}
      version: ${{ needs.version.outputs.version }}
      digest: ${{ needs.version.outputs.digest }}

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Releases are immutable: one created by a previous run (or by hand) is
      # kept as is
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if output="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url --jq .url 2>&1)"; then
            echo "::notice::Release $GITHUB_REF_NAME already exists: $output"
            exit 0
          fi
          if [ "$output" != "release not found" ]; then
            echo "$output"
            echo "::error::Cannot read the release $GITHUB_REF_NAME"
            exit 1
          fi
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            $prerelease
