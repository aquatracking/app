name: CI

on:
  pull_request:
  # Run on each push to main by main.yml, and replayed on the tagged commit by
  # release.yml, before publishing
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      # "node ace codegen" boots the application, which validates them
      NODE_ENV: development
      APP_KEY: ci-only-app-key-not-a-secret-000
      APP_URL: http://localhost:3333
      DB_HOST: 127.0.0.1
      DB_USER: aquatracking
      DB_PASSWORD: aquatracking
      DB_DATABASE: aquatracking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated files in .adonisjs/ are up to date
        run: |
          node ace codegen
          git diff --exit-code -- .adonisjs
          test -z "$(git status --porcelain -- .adonisjs)"
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 16 is the minimum supported version (ADR 0002), 18 the one of compose.yml
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: aquatracking
          POSTGRES_PASSWORD: aquatracking
          POSTGRES_DB: aquatracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquatracking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: UTC
      APP_KEY: ci-only-app-key-not-a-secret-000
      APP_URL: http://localhost:3333
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: aquatracking
      DB_PASSWORD: aquatracking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: database/schema.ts is up to date with the migrations
        env:
          NODE_ENV: development
          DB_DATABASE: aquatracking_test
        run: |
          node ace migration:run
          git diff --exit-code -- database/schema.ts

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aquatracking
          POSTGRES_PASSWORD: aquatracking
          POSTGRES_DB: aquatracking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquatracking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: aquatracking:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (migrations, catalog seeder, server)
        run: |
          docker run -d --name app --network host \
            -e APP_KEY=ci-only-app-key-not-a-secret-000 \
            -e APP_URL=http://localhost:3333 \
            -e DB_HOST=127.0.0.1 -e DB_USER=aquatracking \
            -e DB_PASSWORD=aquatracking -e DB_DATABASE=aquatracking \
            aquatracking:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3333/health/live; then
              curl -fsS http://localhost:3333/ > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
