name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      # "node ace codegen" boots the application, which validates them
      NODE_ENV: development
      APP_KEY: ci-only-app-key-not-a-secret-000
      APP_URL: http://localhost:3333
      DB_HOST: 127.0.0.1
      DB_USER: aquatracking
      DB_PASSWORD: aquatracking
      DB_DATABASE: aquatracking
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated files in .adonisjs/ are up to date
        run: |
          node ace codegen
          git diff --exit-code -- .adonisjs
          test -z "$(git status --porcelain -- .adonisjs)"
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 16 is the minimum supported version (ADR 0002), 18 the one of compose.yml
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: aquatracking
          POSTGRES_PASSWORD: aquatracking
          POSTGRES_DB: aquatracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquatracking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: UTC
      APP_KEY: ci-only-app-key-not-a-secret-000
      APP_URL: http://localhost:3333
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: aquatracking
      DB_PASSWORD: aquatracking
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: database/schema.ts is up to date with the migrations
        env:
          NODE_ENV: development
          DB_DATABASE: aquatracking_test
        run: |
          node ace migration:run
          git diff --exit-code -- database/schema.ts

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aquatracking
          POSTGRES_PASSWORD: aquatracking
          POSTGRES_DB: aquatracking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquatracking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aquatracking:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (migrations, catalog seeder, server)
        run: |
          docker run -d --name app --network host \
            -e APP_KEY=ci-only-app-key-not-a-secret-000 \
            -e APP_URL=http://localhost:3333 \
            -e DB_HOST=127.0.0.1 -e DB_USER=aquatracking \
            -e DB_PASSWORD=aquatracking -e DB_DATABASE=aquatracking \
            aquatracking:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3333/health/live; then
              curl -fsS http://localhost:3333/ > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
