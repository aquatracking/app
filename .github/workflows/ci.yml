name: CI

on:
  pull_request:
  # Run on each push to main by main.yml, and replayed on the tagged commit by
  # release.yml, before publishing
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      # "node ace codegen" boots the application, which validates them
      NODE_ENV: development
      APP_KEY: ci-only-app-key-not-a-secret-000
      APP_URL: http://localhost:3333
      DB_HOST: 127.0.0.1
      DB_USER: aquatracking
      DB_PASSWORD: aquatracking
      DB_DATABASE: aquatracking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated files in .adonisjs/ are up to date
        run: |
          node ace codegen
          git diff --exit-code -- .adonisjs
          test -z "$(git status --porcelain -- .adonisjs)"
      - run: pnpm typecheck

  test:
    # test (16), test (18): the pinned image stays out of the name
    name: test (${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 16 is the minimum supported version (ADR 0002), 18 the one of
        # compose.yml. Images pinned by digest, updated by hand: Dependabot
        # does not read the images of workflows (docs/architecture.md)
        include:
          - postgres: 16
            image: postgres:16@sha256:ce81150802644ddfac1db4da9e63be6f2a3818aa6ee98a7a28838aeea65dc37a
          - postgres: 18
            image: postgres:18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: aquatracking
          POSTGRES_PASSWORD: aquatracking
          POSTGRES_DB: aquatracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquatracking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: UTC
      APP_KEY: ci-only-app-key-not-a-secret-000
      APP_URL: http://localhost:3333
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: aquatracking
      DB_PASSWORD: aquatracking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: database/schema.ts is up to date with the migrations
        env:
          NODE_ENV: development
          DB_DATABASE: aquatracking_test
        run: |
          node ace migration:run
          git diff --exit-code -- database/schema.ts

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned by digest, updated by hand like the test matrix
        image: postgres:16@sha256:ce81150802644ddfac1db4da9e63be6f2a3818aa6ee98a7a28838aeea65dc37a
        env:
          POSTGRES_USER: aquatracking
          POSTGRES_PASSWORD: aquatracking
          POSTGRES_DB: aquatracking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquatracking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: aquatracking:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Migrations, catalog seeder, then the setup page rendered by the server
      # with its assets (.github/scripts/smoke_test.sh)
      - name: Smoke test
        run: |
          docker run -d --name app --network host \
            -e APP_KEY=ci-only-app-key-not-a-secret-000 \
            -e APP_URL=http://localhost:3333 \
            -e DB_HOST=127.0.0.1 -e DB_USER=aquatracking \
            -e DB_PASSWORD=aquatracking -e DB_DATABASE=aquatracking \
            aquatracking:ci
          if ! .github/scripts/smoke_test.sh http://localhost:3333; then
            docker logs app
            exit 1
          fi
