name: Publish

# Publishes the image of the calling commit on GHCR (ADR 0007). Called by
# release.yml (version tags) and main.yml (main tags), once their CI passed:
#   publish       multi-arch image pushed by digest only, without any tag;
#                 skipped when the caller gives an already published digest
#   smoke-test    that digest started on native amd64 and arm64 runners
#   tag           the requested tags set on the tested digest
# The caller sets the concurrency and grants the permissions of these jobs:
# contents: read and packages: write.
on:
  workflow_call:
    inputs:
      tags:
        description: Image tags set on the tested digest, space-separated. The first one is inspected after tagging
        type: string
        required: true
      main-head-tags:
        description: Tags set only if the commit is still the head of main when tagging, space-separated
        type: string
        default: ''
      version:
        description: Value of the org.opencontainers.image.version label and annotation
        type: string
        required: true
      digest:
        description: Digest of an image already published from this commit. Nothing is built; that digest is smoke tested and tagged
        type: string
        default: ''

permissions: {}

env:
  IMAGE: ghcr.io/aquatracking/app

jobs:
  # Pushes the image by digest only: no tag points to it until it has passed
  # the smoke test
  publish:
    name: Push the image by digest
    if: inputs.digest == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Labels and annotations carry the OCI source, version and revision. The
      # raw tag only sets the version: the image is pushed without any tag
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ inputs.version }}
          labels: |
            org.opencontainers.image.title=AquaTracking
            org.opencontainers.image.description=Self-hosted tracking of aquarium, terrarium and paludarium parameters
          annotations: |
            org.opencontainers.image.title=AquaTracking
            org.opencontainers.image.description=Self-hosted tracking of aquarium, terrarium and paludarium parameters

      # arm64 is emulated, but only "pnpm install --prod" runs emulated: the
      # build stages of the Dockerfile run on the runner's platform
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache: nothing written by an earlier job can end up in the
      # published image
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

  # Starts the pushed (or given) digest on each architecture
  smoke-test:
    name: Smoke test (${{ matrix.platform }})
    needs: publish
    # Also when publish is skipped because a digest is given
    if: ${{ !cancelled() && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && inputs.digest != '')) }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      # Checkout of the smoke test script
      contents: read
      packages: read
    services:
      postgres:
        # Pinned by digest, updated by hand like in ci.yml
        image: postgres:16@sha256:ce81150802644ddfac1db4da9e63be6f2a3818aa6ee98a7a28838aeea65dc37a
        env:
          POSTGRES_USER: aquatracking
          POSTGRES_PASSWORD: aquatracking
          POSTGRES_DB: aquatracking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquatracking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Migrations, catalog seeder, then the setup page rendered by the server
      # with its assets (.github/scripts/smoke_test.sh), on the expected
      # architecture
      - name: Smoke test
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ inputs.digest || needs.publish.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run -d --name app --network host --platform "$PLATFORM" \
            -e APP_KEY=ci-only-app-key-not-a-secret-000 \
            -e APP_URL=http://localhost:3333 \
            -e DB_HOST=127.0.0.1 -e DB_USER=aquatracking \
            -e DB_PASSWORD=aquatracking -e DB_DATABASE=aquatracking \
            "$IMAGE_REF"
          if ! .github/scripts/smoke_test.sh http://localhost:3333; then
            docker logs app
            exit 1
          fi
          # Node reports x64 for amd64
          arch="$(docker exec app node -p process.arch)"
          echo "Running on $arch"
          case "$PLATFORM:$arch" in
            linux/amd64:x64 | linux/arm64:arm64) ;;
            *) echo "::error::Expected $PLATFORM, got $arch"; exit 1 ;;
          esac

  # Points the requested tags to the tested digest
  tag:
    name: Tag the image
    needs: [publish, smoke-test]
    if: ${{ !cancelled() && needs.smoke-test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # Reads the head of main for main-head-tags
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main-head-tags (the floating main tag) never go back to an older
      # commit: if main has moved on since this run started, the run of the
      # newer commit sets them
      - name: Set the tags on the digest
        env:
          TAGS: ${{ inputs.tags }}
          MAIN_HEAD_TAGS: ${{ inputs.main-head-tags }}
          SOURCE: ${{ env.IMAGE }}@${{ inputs.digest || needs.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$MAIN_HEAD_TAGS" ]; then
            head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            if [ "$head" = "$GITHUB_SHA" ]; then
              TAGS="$TAGS $MAIN_HEAD_TAGS"
            else
              echo "::notice::main has moved on to $head: $MAIN_HEAD_TAGS not set on $GITHUB_SHA"
            fi
          fi
          args=""
          for tag in $TAGS; do
            args="$args --tag $IMAGE:$tag"
          done
          # shellcheck disable=SC2086 # one word per argument
          docker buildx imagetools create $args "$SOURCE"
          # shellcheck disable=SC2086 # the first tag
          set -- $TAGS
          docker buildx imagetools inspect "$IMAGE:$1"
