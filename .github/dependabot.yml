version: 2
updates:
  # Actions are pinned by commit SHA: Dependabot updates the SHA and the
  # version comment next to it, in a single grouped pull request
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore

  # Base image of the Dockerfile (node:26-alpine), pinned by digest next to
  # its tag: Dependabot updates the digest when the tag gets a new image. The
  # Node major follows .node-version and is upgraded on purpose
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # Development services of compose.yml (PostgreSQL, Mailpit), pinned the
  # same way. A PostgreSQL major needs a data migration: never proposed. The
  # PostgreSQL images of the workflows are not read by Dependabot and are
  # updated by hand (docs/architecture.md)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ['*']
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']

  # npm dependencies (pnpm-lock.yaml). Minor and patch updates are grouped so
  # that packages released together are upgraded together; each major update
  # gets its own pull request, since it needs a review
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      adonisjs:
        patterns: ['@adonisjs/*', '@vinejs/*', '@japa/*', '@tuyau/*', 'edge.js']
        update-types: [minor, patch]
      frontend:
        patterns:
          - vue
          - '@vue/*'
          - vue-tsc
          - '@inertiajs/*'
          - vite
          - '@vitejs/*'
          - tailwindcss
          - '@tailwindcss/*'
          - reka-ui
          - '@unovis/*'
          - '@vueuse/*'
          - '@lucide/*'
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Types follow the Node major in .node-version, upgraded on purpose
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Fixed versions are ESM-only and would break source-map-resolve; see
      # "Audit des dépendances" in docs/architecture.md
      - dependency-name: decode-uri-component
